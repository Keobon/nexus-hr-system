spring.application.name=hr

# --- DB ---
# 로컬 환경이 사람마다 달라서 환경변수로 덮어쓴다. 없으면 아래 기본값을 쓴다.
#   DB_NAME / DB_USER / DB_PASSWORD
# 이 파일은 커밋되므로 개인 계정·비밀번호를 직접 적지 않는다.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:nexus_hr}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# validate: 엔티티와 실제 테이블이 맞는지 검사만. 절대 테이블을 만들거나 지우지 않음.
# 스키마의 기준은 팀 repo의 schema.sql 이다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- 시간대 ---
spring.jackson.time-zone=Asia/Seoul

# --- 파일 업로드 (BR-FILE-001: 1개 10MB 이하) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.file.dir=${FILE_DIR:./uploads}

# --- 인증 / 암호화 ---
# 아래 기본값은 로컬 개발용이다. 운영·시연 서버에서는 환경변수로 반드시 바꾼다.
# APP_ENCRYPTION_KEY 를 바꾸면 이미 저장된 급여 계좌번호를 복호화할 수 없다.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-hours=8
app.crypto.key=${APP_ENCRYPTION_KEY:ZGV2LW9ubHkta2V5LTMyYnl0ZXMtbG9uZy0wMDAwMDA=}

# --- 서버 ---
server.port=8080
