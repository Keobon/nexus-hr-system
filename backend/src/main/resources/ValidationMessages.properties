# 입력값 검증(Bean Validation) 기본 메시지 — 응답 error.fields 에 그대로 나간다(API 설계서 1.3).
# 이 파일이 Hibernate Validator 의 영어 기본 메시지를 덮어쓴다. DTO 에 message 를 직접 적으면 그게 우선이다.
jakarta.validation.constraints.NotNull.message=필수 항목입니다
jakarta.validation.constraints.NotBlank.message=필수 항목입니다
jakarta.validation.constraints.NotEmpty.message=필수 항목입니다
jakarta.validation.constraints.Null.message=입력할 수 없는 항목입니다
jakarta.validation.constraints.Size.message=글자 수(개수)는 {min}~{max} 사이여야 합니다
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다
jakarta.validation.constraints.Max.message={value} 이하여야 합니다
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다
jakarta.validation.constraints.Digits.message=정수 {integer}자리, 소수 {fraction}자리까지 입력할 수 있습니다
jakarta.validation.constraints.Positive.message=0보다 커야 합니다
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다
jakarta.validation.constraints.Negative.message=0보다 작아야 합니다
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다
jakarta.validation.constraints.Email.message=이메일 형식이 아닙니다
jakarta.validation.constraints.Past.message=과거 날짜여야 합니다
jakarta.validation.constraints.PastOrPresent.message=미래 날짜는 입력할 수 없습니다
jakarta.validation.constraints.Future.message=미래 날짜여야 합니다
jakarta.validation.constraints.FutureOrPresent.message=오늘 이후 날짜여야 합니다
jakarta.validation.constraints.AssertTrue.message=허용되지 않는 값입니다
jakarta.validation.constraints.AssertFalse.message=허용되지 않는 값입니다
