# 프론트 개발용: DB(데모 회사 데이터 포함) + 백엔드를 한 번에 띄운다.
#   docker compose up --build      → http://localhost:8080/api/...
#   docker compose down -v         → 끄고 DB 데이터까지 지움(다음 up 때 데모 데이터로 다시 시작)
# 로컬 전용이다. DB 는 이 컴퓨터(127.0.0.1)에서만 접속되고 비밀번호 없이(trust) 연다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus_hr
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed_demo.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # 로컬에 이미 PostgreSQL(5432)이 있어도 겹치지 않게 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_hr"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nexus_hr
      DB_USER: postgres
      SPRING_JPA_SHOW_SQL: "false"
      FILE_DIR: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
